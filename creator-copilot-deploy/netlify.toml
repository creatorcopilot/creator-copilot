[build]
  publish = "public"
  functions = "api"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[functions."intake"]
  timeout = 26

[functions."weekly-delivery"]
  timeout = 26
  schedule = "0 8 * * 1"

[functions."monthly-report"]
  timeout = 26
  schedule = "0 10 1 * *"

# ── SCHEDULED FUNCTIONS ────────────────────────────────────────────
# Daily texts — Every day 9am UTC including Sunday
[functions."daily-text"]
  schedule = "0 9 * * *"

# ── REDIRECTS ──────────────────────────────────────────────────────
[[redirects]]
  from = "/demographic-builder"
  to = "/demographic-builder.html"
  status = 200

[[redirects]]
  from = "/intake"
  to = "/intake-form.html"
  status = 200

[[redirects]]
  from = "/pitch"
  to = "/pitch.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
